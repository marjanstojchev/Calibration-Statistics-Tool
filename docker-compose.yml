version: '3.8'

services:
  # Backend API (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cst-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - QT_QPA_PLATFORM=offscreen
      - CST_DATA_DIR=/data
      - CST_SESSION_TTL_HOURS=24
    volumes:
      # Per-user session workspaces (uploads, outputs, logs); cleaned up after the TTL
      - cst-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Dev Server (optional, for development only)
  frontend-dev:
    image: node:26-alpine
    container_name: cst-frontend-dev
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./cst-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

volumes:
  cst-data:
