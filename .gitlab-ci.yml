# ═══════════════════════════════════════════════════════════════════════════════
# GitLab CI/CD Pipeline for Calibration Statistics Tool
# ═══════════════════════════════════════════════════════════════════════════════
# 
# Pipeline Overview:
#   1. TEST         → Run pytest backend tests (Linux & Windows)
#   2. BUILD-FRONTEND   → Compile React/Vite app
#   3. TEST-E2E     → Full-stack E2E tests (API + UI)
#   4. BUILD        → Build Python package + Docker image
#   5. DEPLOY       → Push to PyPI & Azure Container Apps
#
# Deployment Targets:
#   - PyPI: Python package registry (tags only)
#   - Azure: Container Apps cloud deployment (main branch + tags)
#   - Docker Registry: GitLab Container Registry (auto-tagged)
#
# Dependencies:
#   - GitLab Runner (Linux & Windows tags)
#   - Docker buildkit (for multi-stage builds)
#   - Azure CLI (for deployment)
#   - PyPI credentials (TWINE_USERNAME, TWINE_PASSWORD in CI/CD Variables)
#   - Azure credentials (AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID)
# ═══════════════════════════════════════════════════════════════════════════════

stages:
  - test              # Backend unit tests (pytest)
  - build-frontend    # React app compilation
  - test-e2e          # E2E integration tests (full stack)
  - build             # Python package + Docker image
  - deploy            # Release to PyPI + Azure

# ═══════════════════════════════════════════════════════════════════════════════
# Global Variables
# ═══════════════════════════════════════════════════════════════════════════════
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"        # Pip package cache for faster installs
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"        # Node package cache
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"                 # GitLab Container Registry image path
  DOCKER_TAG: "$CI_COMMIT_REF_SLUG"                  # Docker tag (branch or tag name)

# ═══════════════════════════════════════════════════════════════════════════════
# Shared Configuration Templates (Anchors)
# ═══════════════════════════════════════════════════════════════════════════════

# PIP Cache Template
# Reduces pip install time by caching downloaded packages per branch
.pip-cache:
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}                  # Separate cache per branch
    paths:
      - .cache/pip                                   # Cache pip packages

# NPM Cache Template
# Reduces npm install time by caching node_modules and npm packages per branch
.npm-cache:
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}                  # Separate cache per branch
    paths:
      - cst-frontend/node_modules                   # Cache node dependencies
      - .cache/npm                                  # Cache npm registry data

# Shared Python Installation Steps
# Installs pip, project dependencies, and dev tools (pytest, flake8, etc.)
.pip-installs:
  before_script:
    - python -m pip install --upgrade pip           # Upgrade to latest pip version
    - pip install -e .                              # Install this project in editable mode (for testing)
    - pip install -r requirements-dev.txt           # Install all dependencies including dev/test tools

# Linux Python Setup Template
# Installs Python packages for API/backend testing (no Qt/GUI)
.linux-python:
  extends: .pip-cache
  image: python:3.13                                # Official Python 3.13 image
  before_script:
    - !reference [.pip-installs, before_script]

# ═══════════════════════════════════════════════════════════════════════════════
# TEST STAGE - Unit tests & validation
# ═══════════════════════════════════════════════════════════════════════════════

# Test on Linux (primary CI environment)
# Runs pytest to validate Python backend functionality
test:linux:
  extends: .linux-python
  stage: test
  before_script:
    - !reference [.pip-installs, before_script]    # Use shared pip installation
    - apt-get update && apt-get install -y xvfb    # Install virtual display for headless browser
    - python -m playwright install --with-deps chromium  # Install Chromium via Playwright
  script:
    - python -m pytest --version                    # Display pytest version
    - xvfb-run python -m pytest -v --benchmark-disable --ignore=tests/test_handlers.py --ignore=tests/test_add_and_parse_ptu2_separately.py --ignore=tests/test_limits_smoke.py --ignore=tests/integration/ --ignore=tests/e2e/ --junitxml=report.xml
      # -v: verbose output (show all test names)
      # --benchmark-disable: skip benchmark tests (too slow for CI)
      # --ignore: skip Qt/GUI tests, integration tests, and E2E tests (run separately)
      # xvfb-run: run with virtual frame buffer for headless testing
      # --junitxml=report.xml: generate JUnit XML for GitLab integration
  artifacts:
    reports:
      junit: report.xml                             # GitLab reads this for test results UI
    expire_in: 30 days                              # Keep reports for 30 days
  rules:
    - if: $CI_COMMIT_BRANCH                         # Run on all branch pushes

# Test on Windows (validates cross-platform compatibility)
# Optional/soft-fail if Windows runners not available
test:windows:
  extends: .pip-cache
  stage: test
  before_script:
    - !reference [.pip-installs, before_script]    # Use shared pip installation
    - python -m playwright install --with-deps chromium  # Install Chromium via Playwright
  tags:
    - windows                                       # Requires runner tagged "windows"
  script:
    - python -m pytest --version
    - python -m pytest -v --benchmark-disable --ignore=tests/test_handlers.py --ignore=tests/test_add_and_parse_ptu2_separately.py --ignore=tests/test_limits_smoke.py --ignore=tests/integration/ --ignore=tests/e2e/ --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH
  allow_failure: true                               # Don't block pipeline if Windows runner not available

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD-FRONTEND STAGE - Compile React app with Vite
# ═══════════════════════════════════════════════════════════════════════════════

# Build Frontend - Compile React/JSX → static dist/ files
# Produces optimized bundle ready for production or Docker image
build:frontend:
  extends: .npm-cache
  image: node:26-alpine                             # Lightweight Node.js image
  stage: build-frontend
  before_script:
    - cd cst-frontend                               # Navigate to frontend directory
    - npm ci                                        # Clean install (locks exact versions from package-lock.json)
  script:
    - npm run build                                 # Run Vite build (tsx → jsx → js)
    - ls -la dist/                                  # Display build artifacts
  artifacts:
    paths:
      - cst-frontend/dist/                          # React static files (HTML, CSS, JS bundles)
    expire_in: 1 week                               # Keep for Docker build stage
  rules:
    - if: $CI_COMMIT_BRANCH                         # Build on all branches
    - if: $CI_COMMIT_TAG                            # Build on version tags

# ═══════════════════════════════════════════════════════════════════════════════
# TEST-E2E STAGE - End-to-end integration tests (full stack)
# ═══════════════════════════════════════════════════════════════════════════════

# E2E Tests - Full stack integration testing with Playwright
# Tests the complete user flow: Frontend (React) ↔ Backend (FastAPI)
# Requires both frontend static files (from build:frontend) and backend API running
test:e2e:linux:
  extends: .linux-python
  stage: test-e2e
  dependencies:
    - build:frontend                                # Get cst-frontend/dist/ artifacts
  variables:
    BACKEND_PORT: "8000"                            # FastAPI backend port (configurable in CI/CD vars)
    FRONTEND_PORT: "5173"                           # Frontend static server port (configurable in CI/CD vars)
  before_script:
    - !reference [.pip-installs, before_script]    # Install Python dependencies
    - apt-get update && apt-get install -y xvfb    # Virtual display for headless browser
    - python -m playwright install --with-deps chromium  # Install Chromium browser
  script:
    # Helper function: Try to start server on port, fallback if needed
    - |
      start_backend() {
        for port in $BACKEND_PORT 8001 8002 8003; do
          echo "Trying backend port: $port"
          timeout 3 python -c "import socket; s = socket.socket(); s.bind(('', $port)); s.close()" 2>/dev/null && {
            export BACKEND_PORT=$port
            echo "Backend port available: $BACKEND_PORT"
            return 0
          }
        done
        echo "ERROR: No available backend ports!" && exit 1
      }
    
    - |
      start_frontend() {
        for port in $FRONTEND_PORT 5174 5175 5176; do
          echo "Trying frontend port: $port"
          timeout 3 python -c "import socket; s = socket.socket(); s.bind(('', $port)); s.close()" 2>/dev/null && {
            export FRONTEND_PORT=$port
            export FRONTEND_URL="http://localhost:$port"
            echo "Frontend port available: $FRONTEND_PORT"
            return 0
          }
        done
        echo "ERROR: No available frontend ports!" && exit 1
      }
    
    - start_backend
    - start_frontend
    
    # Start FastAPI backend in background
    - uvicorn api.main:app --host 0.0.0.0 --port $BACKEND_PORT &
    - BACKEND_PID=$!
    - echo "Backend started on port $BACKEND_PORT with PID $BACKEND_PID"
    
    # Serve React frontend static files in background
    - python -m http.server $FRONTEND_PORT --directory cst-frontend/dist &
    - FRONTEND_PID=$!
    - echo "Frontend server started on port $FRONTEND_PORT with PID $FRONTEND_PID"
    
    # Wait for servers to be ready with health checks
    - sleep 5
    - |
      for i in {1..10}; do
        curl -sf http://localhost:$BACKEND_PORT/api/health && echo "✓ Backend ready" && break
        echo "Backend health check attempt $i/10..."
        sleep 1
      done
    - |
      for i in {1..10}; do
        curl -sf http://localhost:$FRONTEND_PORT/ >/dev/null && echo "✓ Frontend ready" && break
        echo "Frontend health check attempt $i/10..."
        sleep 1
      done
    
    # Run E2E tests with detected frontend URL
    - FRONTEND_URL="$FRONTEND_URL" xvfb-run python -m pytest tests/e2e/ -v --junitxml=report-e2e.xml
    
    # Cleanup background processes
    - kill $BACKEND_PID $FRONTEND_PID || true
  artifacts:
    reports:
      junit: report-e2e.xml
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH                         # Run on all branches
  allow_failure: false                              # E2E failures should block pipeline

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD STAGE - Create Python package + Docker image
# ═══════════════════════════════════════════════════════════════════════════════

# Build Python Package (wheel + sdist)
# Creates distribution files for PyPI release
build:package:
  extends: .linux-python
  stage: build
  script:
    - python -m pip install --upgrade build         # Install latest build tool
    - python -m build                               # Create wheel (.whl) and sdist (.tar.gz)
      # Output: dist/calibration-statistics-tool-*.whl
  artifacts:
    paths:
      - dist/                                       # Python distribution files
    expire_in: 1 week                               # Keep for PyPI deployment
  rules:
    - if: $CI_COMMIT_BRANCH                         # Build on all branches
    - if: $CI_COMMIT_TAG                            # Build on version tags

# Build Docker Image
# Creates multi-stage Docker image:
#   Stage 1: Node.js alpine → builds React (small layer)
#   Stage 2: Python 3.13 → FastAPI backend + React static files
# Final image serves both API and React frontend from single container
build:docker:
  stage: build
  image: docker:27                                  # Docker CLI image
  services:
    - docker:27-dind                                # Docker-in-Docker daemon (required for building)
  before_script:
    # Login to GitLab Container Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build image with commit ref tag (e.g., main, feat-new-ui)
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
    # Also tag as 'latest' for easy access to most recent build
    - docker tag $DOCKER_IMAGE:$DOCKER_TAG $DOCKER_IMAGE:latest
    # Push both tags to registry
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "web-cloud-ui"  # Build main and web-cloud-ui
    - if: $CI_COMMIT_TAG                            # Build all version tags
  dependencies:
    - build:frontend                                # Needs cst-frontend/dist/ from build:frontend

# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY STAGE - Release to PyPI & Azure
# ═══════════════════════════════════════════════════════════════════════════════

# Deploy to PyPI (Python Package Index)
# Publishes Python wheel package for pip install
# Only runs on version tags (e.g., v1.0.0, v1.0.1)
deploy:pypi:
  extends: .linux-python
  stage: deploy
  dependencies:
    - build:package                                 # Download dist/ artifacts
  script:
    - python -m pip install --upgrade twine         # Install package publisher
    - python -m twine check dist/*                  # Validate distribution files before upload
    # Upload to PyPI using provided credentials
    # Credentials stored in GitLab CI/CD Variables (Settings → CI/CD → Variables)
    # TWINE_USERNAME: your PyPI username
    # TWINE_PASSWORD: your PyPI API token (preferred over password)
    - python -m twine upload -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" dist/* --non-interactive
  rules:
    - if: $CI_COMMIT_TAG                            # Only deploy on version tags (e.g., v1.0.0)
  environment:
    name: production                                # Mark deployment in GitLab UI
    url: https://pypi.org/project/calibration-statistics-tool/

# Deploy to Azure Container Apps
# Deploys Docker image to Azure cloud infrastructure
# Requires Azure service principal credentials stored in CI/CD Variables
deploy:azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest        # Official Azure CLI image
  before_script:
    # Login to Azure using service principal (credentials in CI/CD Variables)
    # AZURE_CLIENT_ID: Application ID from Azure AD
    # AZURE_CLIENT_SECRET: Service principal password/secret
    # AZURE_TENANT_ID: Azure tenant ID
    - az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
  script:
    # Grant Azure Container Apps access to GitLab Container Registry
    # CI_REGISTRY_USER / CI_REGISTRY_PASSWORD are injected automatically by GitLab
    - az containerapp registry set --name calibration-tool-app --resource-group $AZURE_RESOURCE_GROUP --server $CI_REGISTRY --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD
    # Update running Container App with new Docker image
    # This triggers Azure to:
    #   1. Pull new image from registry
    #   2. Stop old pods
    #   3. Start new pods with updated image
    #   4. Perform health checks
    - az containerapp update --name calibration-tool-app --resource-group $AZURE_RESOURCE_GROUP --image $DOCKER_IMAGE:$DOCKER_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "web-cloud-ui"   # Deploy main and web-cloud-ui branches
    - if: $CI_COMMIT_TAG                            # Deploy all version tags
  environment:
    name: azure-production                          # Mark deployment in GitLab UI
    url: https://calibration-tool-app.graybush-94365d45.westeurope.azurecontainerapps.io
  dependencies:
    - build:docker                                  # Needs Docker image (implicitly via registry)
  needs:
    - build:docker                                  # Explicitly declare dependency for optimization

