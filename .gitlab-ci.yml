# GitLab CI/CD Pipeline for Calibration Statistics Tool
# This pipeline runs tests and validates the Python application

stages:
  # - lint
  - test
  - build
  - deploy

# Define variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"         # Where pip cache is stored
  QT_QPA_PLATFORM: "offscreen"                        # Run Qt in headless mode for CI

# Shared cache configuration
.pip-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}                        # Cache key per branch
    paths:
      - .cache/pip                                     # Cache pip downloads

# Shared Python installation steps
.pip-installs:
  before_script:
    - python -m pip install --upgrade pip             # Upgrade pip
    - pip install -e .                                # Install project with dependencies
    - pip install -r requirements.txt                 # Install dev tools (pytest, flake8, etc.)

# Linux Python setup (apt-get dependencies + pip installs)
.linux-python:
  extends: .pip-cache
  image: python:3.13
  before_script:
    - apt-get update && apt-get install -y libgl1-mesa-dev libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 libxrender1 libxrandr2 libdbus-1-3 xvfb # Install Qt/PySide6 dependencies
    - !reference [.pip-installs, before_script]       # Then run shared pip installs

# Test Stage - Run pytest on Linux
test:linux:
  extends: .linux-python
  stage: test
  script:
    - python -m pytest --version
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH

# Test Stage - Run pytest on Windows
test:windows:
  extends: .pip-cache
  stage: test
  before_script:
    - !reference [.pip-installs, before_script]       # Use shared pip installs
  tags:
    - windows                                         # Requires Windows runner
  script:
    - python -m pytest --version
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH
  allow_failure: true                                 # Don't block pipeline if Windows runner unavailable

# Build Stage - Package the application
build:
  extends: .linux-python
  stage: build
  script:
    - python -m pip install --upgrade build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH                           # Build on all branches (for testing)
    - if: $CI_COMMIT_TAG                              # Also build on tags (for deployment)

# Deploy Stage - Publish package to PyPI
deploy:pypi:
  extends: .linux-python
  stage: deploy
  dependencies:
    - build                                           # Download artifacts from build job
  script:
    - python -m pip install --upgrade twine           # Install twine for uploading to PyPI
    - python -m twine check dist/*                    # Validate distribution files
    - python -m twine upload dist/* --non-interactive # Upload to PyPI using credentials
  rules:
    - if: $CI_COMMIT_TAG                              # Only deploy on git tags (e.g., v1.0.0)
  environment:
    name: production
    url: https://pypi.org/project/calibration-statistics-tool/

# Deploy Stage - Build and Push Docker image
deploy:docker:
  image: docker:latest
  stage: deploy
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build
  environment:
    name: docker-production
    url: $CI_REGISTRY_IMAGE

