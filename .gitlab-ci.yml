# GitLab CI/CD Pipeline for Calibration Statistics Tool
# This pipeline runs tests and validates the Python application

stages:
  # - lint
  - test
  # - build

# Define variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"         # Where pip cache is stored

# Hidden template job for Python jobs
.default-python:
  image: python:3.13                                  # Base image for Python jobs
  before_script:
    - apt-get update && apt-get install -y libgl1-mesa-glx # Install libGL for PySide6
    - python -m pip install --upgrade pip             # Upgrade pip first
    - pip install -e .                                # Install project with dependencies
    - pip install -r requirements.txt                 # Install dev tools (pytest, flake8, etc.)
  cache:
    key: ${CI_COMMIT_REF_SLUG}                        # Cache key per branch
    paths:
      - .cache/pip                                     # Cache pip downloads

# Test Stage - Run pytest
test:
  extends: .default-python
  stage: test
  script:
    - python -m pytest --version
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH

